name: Native performance host

on:
  pull_request:
    paths:
      - 'lib/native-host/**'
      - 'lib/native-alsa/**'
      - 'lib/remote-performance/**'
      - 'lib/performance/**'
      - 'lib/sequencer/**'
      - 'lib/sampler/**'
      - 'lib/beat-tracker/**'
      - 'lib/patches/**'
      - 'lib/tuner/**'
      - 'ui/practice/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/stage-session-release.py'
      - 'scripts/tests/stage-session-release.test.py'
      - 'scripts/build-session-release.ts'
      - 'scripts/session-bundles.ts'
      - 'scripts/check-focused.ts'
      - 'scripts/tests/check-focused.test.ts'
      - '.github/workflows/native-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux ALSA development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libasound2-dev
      - name: Check standalone audio boundary configuration
        run: cmake -S lib/native-alsa -B build/native-alsa -DCMAKE_BUILD_TYPE=Release
      - name: Build and test the native performance host
        run: |
          cmake -S lib/native-host -B build/native-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host --parallel
          ctest --test-dir build/native-host --output-on-failure
      - name: Verify parent includes standalone audio tests
        run: |
          ctest --test-dir build/native-alsa --show-only=json-v1 > build/alsa-tests.json
          ctest --test-dir build/native-host --show-only=json-v1 > build/host-tests.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          def names(path):
              return {test['name'] for test in json.loads(Path(path).read_text())['tests']}
          standalone = names('build/alsa-tests.json')
          assert standalone, 'Standalone audio boundary must register tests'
          assert standalone <= names('build/host-tests.json'), 'Parent lost standalone audio tests'
          PYTHON
      - name: Stage Linux host with provenance
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/artifact
          cp build/native-host/native_alsa_host build/artifact/
          cp lib/native-alsa/README.md build/artifact/ALSA-NOTICE.md
          cp /usr/share/common-licenses/LGPL-2.1 build/artifact/
          git rev-parse HEAD > build/artifact/source-revision.txt
          c++ --version > build/artifact/compiler.txt
          dpkg-query -W libasound2-dev libasound2t64 libc6 libstdc++6 > build/artifact/packages.txt
          ldd build/artifact/native_alsa_host > build/artifact/runtime-dependencies.txt
          cd build/artifact
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: native-alsa-linux-x86_64-${{ github.sha }}
          path: build/artifact/
          if-no-files-found: error

  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build fake native host for IPC tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libasound2-dev
          cmake -S lib/native-host -B build/native-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host --target native_fake_host --parallel
      - run: npm run typecheck
      - name: Test focused check selection
        run: node --import tsx --test scripts/tests/check-focused.test.ts
      - name: Test release staging without executing release code
        run: python3 scripts/tests/stage-session-release.test.py
      - name: Test remote controls without hardware
        run: node --import tsx --test --test-concurrency=4 lib/remote-performance/tests/*.test.ts ui/practice/tests/remote-session.test.ts
