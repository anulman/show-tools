<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAD desk</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#23302c;background:#f5f3ed;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:28px;padding:12px 20px;border-bottom:1px solid #d8ddd5;background:#faf9f5;flex-wrap:wrap}
    h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.3px}
    [role=tablist]{display:flex;flex-wrap:wrap;gap:5px;background:#e8ebe3;padding:4px;border-radius:10px}
    [role=tab]{font:inherit;font-size:14px;font-weight:550;border:0;padding:9px 18px;border-radius:7px;background:transparent;color:#56625a;cursor:pointer}
    [role=tab][aria-selected=true]{background:#fff;color:#173d30;box-shadow:0 1px 4px #182c181c}
    button:focus-visible{outline:3px solid #58a87d;outline-offset:2px}button:disabled{cursor:wait;opacity:.6}
    #status{margin:0 0 0 auto;font-size:13px;color:#56625a;max-width:48ch}
    main{position:relative;flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:white;display:block}
    #busy{position:absolute;inset:0;background:#f5f3ed8c;display:grid;place-items:center;backdrop-filter:blur(2px)}
    #busy[hidden]{display:none}#busy span{background:#fff;padding:14px 22px;border:1px solid #d8ddd5;border-radius:12px;box-shadow:0 5px 25px #24352815}
    footer{font-size:11px;padding:6px 20px;color:#667067;border-top:1px solid #d8ddd5}
    @media(max-width:600px){header{padding:10px;gap:10px}h1{display:none}#status{font-size:12px;width:100%;margin:0}[role=tab]{padding:8px 14px}footer{padding:5px 10px}}
  </style>
</head>
<body data-selected="__SELECTED__">
  <header>
    <h1>CAD desk</h1>
    <nav role="tablist" aria-label="CAD workstreams">
      <button id="box-mount-tab" role="tab" disabled aria-controls="model-panel" aria-selected="false" tabindex="-1" data-model="box-mount">Arcade button</button>
      <button id="disco-bar-tab" role="tab" disabled aria-controls="model-panel" aria-selected="false" tabindex="-1" data-model="disco-bar">Disco ball</button>
      <button id="mushroom-mount-tab" role="tab" disabled aria-controls="model-panel" aria-selected="false" tabindex="-1" data-model="mushroom-mount">Mushroom mount</button>
      <button id="micro-enclosure-tab" role="tab" disabled aria-controls="model-panel" aria-selected="false" tabindex="-1" data-model="micro-enclosure">Micro enclosure</button>
      <button id="all-controls-tab" role="tab" disabled aria-controls="model-panel" aria-selected="false" tabindex="-1" data-model="all-controls">All controls</button>
    </nav>
    <p id="status" role="status" aria-live="polite">Connecting to the viewer…</p>
  </header>
  <main id="model-panel" role="tabpanel" aria-label="3D model" aria-busy="true">
    <iframe id="viewer" title="Interactive CAD model"></iframe>
    <div id="busy"><span>Preparing preview…</span></div>
  </main>
  <footer>Concept previews · Physical fit and print readiness remain unverified · Use Scrawl to share feedback</footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
